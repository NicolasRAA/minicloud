openapi: 3.0.3
info:
  title: Мини-облако API
  version: 1.1.1
  description: |
    Контракт между PWA-клиентом «Мини-облака» и сервером. Спецификацию пишем
    руками до кода (contract-first); сгенерированный FastAPI документ сверяется
    с этим файлом в CI.

    **Версия 1.1 (ПР3, модель DDD).** Названия в контракте взяты из единого
    языка (docs/domain/model.md): отпечаток (`fingerprint`) вместо хэша, место
    в облаке (`cloud_space`) вместо квоты, история вместо ленты изменений.
    Завершение загрузки отвечает 202: файл создаёт контекст «Файлы», получив
    событие «Загрузка завершена». Клиентов у v1 ещё нет, поэтому контракт
    меняется на месте, без /api/v2.

    **Версия 1.1.1 (ПР4).** Контракт не менялся, описан состав access-токена
    (схема `bearerAuth`) и записано, что 412 на изменение узла бывает и при
    одновременных запросах с двух устройств (ADR-003).

    **Общие правила**

    * Все ответы и тела запросов в JSON (UTF-8). Время в UTC, формат RFC 3339.
    * Идентификаторы: UUID. Вместо UUID корневой папки можно писать `root`,
      вместо идентификатора корзины `trash` (только для просмотра списка).
    * Байты файлов через API не проходят. Загрузка идёт частями прямо в
      S3-хранилище по подписанным ссылкам, скачивание по `download_url`.
    * Списки отдаются страницами по курсору: `next_cursor` из ответа
      передаётся в параметре `cursor` следующего запроса.
    * Изменение и удаление узла требуют заголовка `If-Match` со значением
      `ETag` (это версия узла в кавычках, например `"3"`). Если узел успел
      измениться, сервер ответит 412, если заголовка нет, то 428.
    * Ответы с данными пользователя приходят с `Cache-Control: no-store`.
    * Повтор любого запроса после обрыва связи безопасен: создание папки
      возвращает уже созданную папку, загрузка находится по папке, имени и
      отпечатку, завершение загрузки повторяет прежний ответ, PATCH защищён
      `If-Match`, а DELETE идемпотентен по определению. Возможные дубли:
      лишняя гостевая ссылка (её видно в списке и можно отозвать) и, пока не
      введён заголовок `Idempotency-Key`, повтор старта загрузки-дубликата:
      она сразу завершается, поэтому уникальность незавершённой загрузки её
      не ловит (замечание 4 ревью ПР4, исправляем до кода).

    **Ошибки** приходят в формате `application/problem+json` (RFC 9457).
    Поле `type` различает причины:

    | type | Код | Когда |
    |---|---|---|
    | `/problems/malformed-request` | 400 | тело не разбирается как JSON |
    | `/problems/unauthorized` | 401 | нет токена, токен истёк, неверный пароль, refresh-токен отозван |
    | `/problems/not-found` | 404 | узла нет или он принадлежит другому пользователю |
    | `/problems/name-conflict` | 409 | имя уже занято в папке |
    | `/problems/invalid-move` | 409 | перенос папки в саму себя, изменение корня, цель в корзине |
    | `/problems/not-in-trash` | 409 | окончательно удалить можно только узел из корзины |
    | `/problems/not-shareable` | 409 | ссылку можно выдать только на проверенный файл вне корзины |
    | `/problems/not-enough-space` | 409 | файлу не хватает места в облаке |
    | `/problems/upload-incomplete` | 409 | загружены не все части |
    | `/problems/upload-closed` | 409 | загрузка отменена, просрочена или уже завершается |
    | `/problems/gone` | 410 | ссылка отозвана или истекла, курсор истории устарел |
    | `/problems/precondition-failed` | 412 | `If-Match` не совпал с текущей версией: узел изменили раньше или в ту же секунду на другом устройстве |
    | `/problems/validation` | 422 | ошибки в полях, список в `errors` |
    | `/problems/precondition-required` | 428 | нет `If-Match` |
    | `/problems/rate-limited` | 429 | превышен лимит запросов |

    Полные адреса типов начинаются с `https://minicloud.example`.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://minicloud.example/api/v1
    description: Стенд (адрес условный)
  - url: /api/v1
    description: Тот же хост, с которого открыт документ (локальный запуск через docker compose)
tags:
  - name: auth
    description: Вход, обновление токенов, выход, профиль
  - name: nodes
    description: Папки, файлы и корзина
  - name: uploads
    description: Загрузка файлов частями с докачкой
  - name: shares
    description: Гостевые ссылки на файлы
  - name: changes
    description: История изменений для синхронизации вкладок и устройств
security:
  - bearerAuth: []

paths:
  /auth/tokens:
    post:
      tags: [auth]
      operationId: issueTokens
      summary: Войти по паролю или обновить токены
      description: |
        Выдаёт access-токен (JWT на 15 минут) в теле ответа и refresh-токен в
        cookie `mc_refresh` с флагами HttpOnly, Secure, SameSite=Strict.
        Cookie ограничена путём `/api/v1/auth/tokens`, поэтому остальные
        запросы её не несут.

        * `type: password`: вход по email и паролю. Пароли хранятся как
          Argon2id. Не больше 5 попыток в минуту на пару «IP + email».
        * `type: refresh_token`: продление сеанса входа. Refresh-токен из
          cookie обменивается на новую пару, старый после обмена недействителен
          (ротация по RFC 9700). В сеансе действует только последний выданный
          ключ. Повтор со старым токеном в течение 30 секунд считается повтором
          запроса (ответ потерялся или две вкладки обновились одновременно):
          сервер выдаёт следующий ключ цепочки, а выданный перед ним перестаёт
          действовать. Позже сервер считает повтор кражей и завершает этот сеанс
          входа; на других устройствах пользователь остаётся.

        Это не OAuth 2.0: клиент у сервера один (своя PWA), сторонних
        приложений нет.
      security:
        - {}
        - refreshCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              password:
                summary: Вход по паролю
                value:
                  type: password
                  email: anna@example.com
                  password: correct horse battery staple
              refresh:
                summary: Обновление по cookie
                value:
                  type: refresh_token
      responses:
        '200':
          description: Новая пара токенов
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [auth]
      operationId: revokeTokens
      summary: Выйти
      description: |
        Завершает сеанс входа, к которому относится refresh-токен из cookie,
        и стирает cookie. На других устройствах пользователь остаётся. Ответ
        всегда 204, даже если cookie нет или сеанс уже завершён.
        Выданный access-токен доживает свои 15 минут, поэтому клиент удаляет
        его из памяти сам.
      security:
        - {}
        - refreshCookie: []
      responses:
        '204':
          description: Сессия закрыта
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me:
    get:
      tags: [auth]
      operationId: getProfile
      summary: Профиль и место в облаке текущего пользователя
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /nodes/{folderId}/children:
    parameters:
      - $ref: '#/components/parameters/FolderId'
    get:
      tags: [nodes]
      operationId: listChildren
      summary: Содержимое папки или корзины
      description: |
        Обычная папка: сначала папки, потом файлы, внутри по имени без учёта
        регистра. Для `trash` возвращаются узлы, удалённые пользователем явно,
        от новых к старым; их содержимое можно открыть этим же запросом по id.
        Узлы, которые уже удаляются навсегда, в список не попадают.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница списка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    post:
      tags: [nodes]
      operationId: createFolder
      summary: Создать папку
      description: |
        Если в папке уже есть папка с таким именем (без учёта регистра),
        сервер не создаёт вторую, а возвращает существующую с кодом 200.
        Поэтому повтор запроса после обрыва связи безопасен. Если имя занято
        файлом, ответ 409. В `trash` создавать ничего нельзя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderCreate'
            example:
              name: Отчёты
      responses:
        '201':
          description: Папка создана
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
              examples:
                folder:
                  $ref: '#/components/examples/FolderNode'
        '200':
          description: Папка с таким именем уже была, возвращена она
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'

  /nodes/{nodeId}:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [nodes]
      operationId: getNode
      summary: Метаданные узла и ссылка на скачивание
      description: |
        Для проверенного файла вне корзины (`status: available`) в ответе есть
        `download_url`: подписанная ссылка на S3 со сроком 5 минут. Браузер
        скачивает файл по ней напрямую, минуя API. ETag отражает версию
        метаданных узла, ссылка на скачивание в него не входит.
      responses:
        '200':
          description: Узел
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
              examples:
                file:
                  $ref: '#/components/examples/FileNode'
                folder:
                  $ref: '#/components/examples/FolderNode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [nodes]
      operationId: updateNode
      summary: Переименовать, переместить, убрать в корзину или восстановить
      description: |
        Меняются только переданные поля.

        * `trashed: true` убирает узел в корзину. Пометку получает только он
          сам: всё, что лежит в папке, считается удалённым вместе с ней, поэтому
          папка с любым числом файлов удаляется одной короткой транзакцией.
          Через 30 дней фоновая задача удалит узел навсегда. Повторное
          удаление того, что уже в корзине, ничего не меняет и отвечает 200
          даже с устаревшим `If-Match`: результат тот же, что у первого запроса.
        * `trashed: false` восстанавливает узел в его папку. Если эта папка сама
          в корзине или уже удалена навсегда, узел попадает в корень, если не
          указан `parent_id`. Если имя на месте занято, к нему добавляется номер:
          «Отчёт (2).pdf».
        * Перенос папки внутрь её же потомка, перенос в папку из корзины и
          любые изменения корня дают 409.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodePatch'
            examples:
              rename:
                summary: Переименование
                value:
                  name: ПР2 (финал).pdf
              move:
                summary: Перенос в другую папку
                value:
                  parent_id: ab588fc4-4b23-4bc2-8294-da3c6187c905
              trash:
                summary: В корзину
                value:
                  trashed: true
              restore:
                summary: Восстановление из корзины
                value:
                  trashed: false
      responses:
        '200':
          description: Узел после изменения
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [nodes]
      operationId: deleteNode
      summary: Удалить из корзины навсегда
      description: |
        Работает только для узла, который пользователь сам убрал в корзину.
        Узел сразу пропадает из корзины и с других устройств (в истории
        появляется одна запись `purged`). Поддерево большой папки стирает
        фоновая задача порциями; место в облаке освобождается по мере
        удаления файлов, объекты в S3 удаляются, когда на содержимое больше не
        ссылается ни один файл. Узлы внутри папки, которые раньше удалили в
        корзину отдельно, остаются в корзине со своим сроком. Повторный DELETE
        вернёт 404, клиент считает это успехом.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Узел удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /nodes/{nodeId}/shares:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [shares]
      operationId: listShares
      summary: Действующие ссылки на файл
      responses:
        '200':
          description: Ссылки, которые ещё не истекли и не отозваны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [shares]
      operationId: createShare
      summary: Создать гостевую ссылку
      description: |
        Ссылку можно выдать только на файл со статусом `available`, который не
        в корзине. Папками делиться пока нельзя. Полный адрес ссылки (`url`)
        приходит один раз, в этом ответе: в базе хранится только SHA-256
        токена. Повтор запроса создаст вторую ссылку; это безопасно, лишнюю
        видно в списке и её можно отозвать.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareCreate'
            example:
              expires_in_days: 7
      responses:
        '201':
          description: Ссылка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
              example:
                id: 0d71da9b-5fac-4f1f-859b-6239d18394ab
                node_id: 16e7dfaf-cbc1-4e53-be83-d2a58cf189cf
                url: https://minicloud.example/s/Kr6ez18yrIhhIgUHzpP3x3pMVmxVWmdnYs-dhRAvFRg
                created_at: '2026-09-29T10:20:00Z'
                expires_at: '2026-10-06T10:20:00Z'
                open_count: 0
                last_opened_at: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'

  /shares/{shareId}:
    parameters:
      - $ref: '#/components/parameters/ShareId'
    delete:
      tags: [shares]
      operationId: revokeShare
      summary: Отозвать ссылку
      description: Повторный отзыв тоже возвращает 204.
      responses:
        '204':
          description: Ссылка больше не работает
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /public/shares/{token}:
    parameters:
      - $ref: '#/components/parameters/ShareToken'
    get:
      tags: [shares]
      operationId: getPublicShare
      summary: Открыть файл по гостевой ссылке
      description: |
        Вход не нужен. Ответ содержит имя, размер и `download_url` на 5 минут.
        Каждое обращение увеличивает счётчик `open_count`. Ссылка не
        открывается, если истекла, отозвана, а также пока файл в корзине.
        Лимит: 60 запросов в минуту с одного IP.
      security: []
      responses:
        '200':
          description: Сведения о файле и ссылка на скачивание
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicShare'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Начать или возобновить загрузку файла
      description: |
        Клиент заранее считает отпечаток содержимого (см. `fingerprint`) и
        передаёт его вместе с размером. Дальше возможны три исхода.

        1. Есть незавершённая загрузка для той же папки, имени и отпечатка
           (например, вкладку закрыли посреди загрузки): ответ 200 с ней,
           списком уже принятых частей и ссылками на недостающие.
        2. У пользователя уже есть проверенное содержимое с тем же отпечатком
           (дубликат): байты не передаются, загрузка сразу завершается, ответ
           201 со статусом `completed`. Файл появится в папке уже проверенным.
        3. Иначе начинается новая загрузка: ответ 201 и ссылки на первые части.

        Во втором и третьем случае сервер сначала резервирует под файл место в
        облаке; дубликат занимает место так же, как обычный файл. Если места не
        хватает с учётом других незавершённых загрузок, ответ 409
        `not-enough-space` и загрузка не начинается. ID будущего файла
        (`file_id`) известен с первого ответа.

        Файл делится на части по 8 МиБ (последняя может быть меньше). Файл
        предельного размера 50 ГиБ даёт 6400 частей, это в пределах
        ограничения S3 в 10 000 частей.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCreate'
            example:
              parent_id: ab588fc4-4b23-4bc2-8294-da3c6187c905
              name: Запись лекции 3.mp4
              size_bytes: 52428800
              fingerprint: 3b28d13f4f498ba98316d77dcc3064eb0e7c90837201d074733cf34425c74d51
              mime_type: video/mp4
              device_modified_at: '2026-09-28T18:40:00Z'
      responses:
        '201':
          description: Начата новая загрузка или найден дубликат (загрузка сразу завершена)
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '200':
          description: Найдена незавершённая загрузка, её можно докачать
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
              examples:
                resumed:
                  $ref: '#/components/examples/ResumedUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'

  /uploads/{uploadId}:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Состояние загрузки и свежие ссылки на части
      description: |
        Список загруженных частей сервер берёт из S3 (ListParts), а не из своей
        базы, поэтому он верен даже после падения клиента. В `part_urls`
        приходят ссылки не больше чем на 100 недостающих частей, каждая
        действует час. Когда ссылки кончатся или истекут, клиент запрашивает
        новые этим же вызовом.
      responses:
        '200':
          description: Сессия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
              examples:
                resumed:
                  $ref: '#/components/examples/ResumedUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: Завершить загрузку
      description: |
        Сервер сверяет части с данными S3 и собирает объект
        (CompleteMultipartUpload). Загрузка завершается своей транзакцией и
        той же транзакцией записывает событие «Загрузка завершена» в журнал.
        Файл создаёт не этот запрос, а контекст «Файлы», получив событие:
        обычно через доли секунды файл появляется в папке со статусом
        `verifying`. Поэтому ответ 202, а `Location` указывает на будущий файл
        `file_id`; пока событие не обработано, `GET /nodes/{file_id}` отвечает
        404, и клиент показывает файл по данным загрузки.

        Пока отпечаток не проверен, файл виден в папке, но скачать его и
        поделиться им нельзя. Если имя за время загрузки заняли, к нему
        добавляется номер: «отчёт (2).pdf»; если папку назначения удалили,
        файл попадает в корень. Повторный вызов для завершённой загрузки
        возвращает тот же ответ.
      responses:
        '202':
          description: Загрузка завершена, файл появится в папке после обработки события
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [uploads]
      operationId: abortUpload
      summary: Отменить загрузку
      description: |
        Прерывает multipart-загрузку в S3 и снимает резерв места в облаке.
        Для уже отменённой или просроченной загрузки тоже 204, для
        завершённой 409.
      responses:
        '204':
          description: Загрузка отменена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /changes:
    get:
      tags: [changes]
      operationId: listChanges
      summary: История изменений
      description: |
        Без `cursor` возвращает пустой список и курсор на текущий конец
        истории: так клиент получает точку отсчёта перед тем, как загрузить
        дерево. С курсором возвращает записи после него по возрастанию `seq`.
        У каждого пользователя номера идут подряд, без пропусков и в порядке
        фиксации изменений: номер выдаёт счётчик владельца, который держится
        до конца транзакции. Пропущенный номер означает ошибку, а не задержку.
        Удаление папки даёт одну запись на папку, а не на каждый файл внутри.
        Записи хранятся 90 дней; если записей после курсора уже нет, сервер
        ответит 410, и клиенту нужно заново прочитать дерево. Открытая вкладка
        опрашивает историю раз в 30 секунд.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: События
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableContent'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access-токен из `POST /auth/tokens`, живёт 15 минут. Клиент держит его
        только в памяти вкладки, в localStorage не пишет.

        Заголовок: `{"alg": "HS256", "typ": "at+jwt", "kid": "<номер ключа>"}`.
        Утверждения (claims):

        | Claim | Пример | Зачем |
        |---|---|---|
        | `iss` | `https://minicloud.example` | кто выпустил; проверяется |
        | `aud` | `minicloud-api` | для кого; проверяется |
        | `sub` | UUID учётной записи | кто это; единственное, что нужно контекстам (связь С2) |
        | `sid` | UUID сеанса входа | связывает запрос с сеансом в журнале безопасности |
        | `iat` | время выпуска | |
        | `exp` | `iat` + 900 секунд | срок жизни 15 минут |

        Ролей, имени и email в токене нет: payload не шифруется, а операций
        администратора в API v1 нет. Сервер принимает только `alg = HS256` и
        `typ = at+jwt`, ключ берёт по `kid` из окружения (256 случайных бит),
        в базу при проверке не ходит.
    refreshCookie:
      type: apiKey
      in: cookie
      name: mc_refresh
      description: |
        Refresh-токен: 256 случайных бит, живёт 30 дней, одноразовый. Cookie
        HttpOnly, поэтому скрипт на странице её не прочитает.

  parameters:
    NodeId:
      name: nodeId
      in: path
      required: true
      description: UUID узла или `root`
      schema:
        type: string
        pattern: '^(root|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
      example: 16e7dfaf-cbc1-4e53-be83-d2a58cf189cf
    FolderId:
      name: folderId
      in: path
      required: true
      description: UUID папки, `root` или `trash`
      schema:
        type: string
        pattern: '^(root|trash|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
      example: root
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareToken:
      name: token
      in: path
      required: true
      description: Токен из гостевой ссылки, 32 байта в base64url
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозрачный курсор из `next_cursor` предыдущего ответа
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag узла, полученный при чтении
      schema:
        type: string
      example: '"3"'

  headers:
    ETag:
      description: Версия узла в кавычках
      schema:
        type: string
      example: '"3"'
    Location:
      description: Адрес созданного ресурса
      schema:
        type: string
      example: /api/v1/nodes/16e7dfaf-cbc1-4e53-be83-d2a58cf189cf
    RetryAfter:
      description: Через сколько секунд можно повторить запрос
      schema:
        type: integer
      example: 30
    NoStore:
      description: Ответ нельзя кэшировать
      schema:
        type: string
      example: no-store
    SetRefreshCookie:
      description: Новый refresh-токен
      schema:
        type: string
      example: mc_refresh=q3N...; Path=/api/v1/auth/tokens; Max-Age=2592000; HttpOnly; Secure; SameSite=Strict
    ClearRefreshCookie:
      description: Удаление cookie
      schema:
        type: string
      example: mc_refresh=; Path=/api/v1/auth/tokens; Max-Age=0; HttpOnly; Secure; SameSite=Strict

  responses:
    BadRequest:
      description: Тело запроса не разбирается
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Нужен вход
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://minicloud.example/problems/unauthorized
            title: Требуется вход
            status: 401
            detail: Срок действия токена истёк
    NotFound:
      description: Объект не найден или принадлежит другому пользователю
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Операция противоречит текущему состоянию
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            nameConflict:
              summary: Имя занято
              value:
                type: https://minicloud.example/problems/name-conflict
                title: Имя уже занято
                status: 409
                detail: В папке «Отчёты» уже есть файл «ПР2.pdf»
                existing_node_id: 16e7dfaf-cbc1-4e53-be83-d2a58cf189cf
            notEnoughSpace:
              summary: Не хватает места в облаке
              value:
                type: https://minicloud.example/problems/not-enough-space
                title: Не хватает места в облаке
                status: 409
                detail: Файлу нужно 3,2 ГБ, свободно 1,1 ГБ. Освободите место или очистите корзину
                required_bytes: 3435973837
                free_bytes: 1181116006
            uploadIncomplete:
              summary: Не все части загружены
              value:
                type: https://minicloud.example/problems/upload-incomplete
                title: Загружены не все части
                status: 409
                detail: Не хватает частей 5 и 7
                missing_parts: [5, 7]
    Gone:
      description: Ресурс существовал, но больше недоступен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://minicloud.example/problems/gone
            title: Ссылка больше не действует
            status: 410
            detail: Срок действия ссылки истёк 06.10.2026
    PreconditionFailed:
      description: Узел изменился после чтения, нужно перечитать его
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: Ошибки в параметрах или полях запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://minicloud.example/problems/validation
            title: Некорректные данные
            status: 422
            errors:
              - field: name
                message: Имя не может содержать символ «/»
    PreconditionRequired:
      description: Запрос должен содержать If-Match
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

