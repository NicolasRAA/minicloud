  schemas:
    Uuid:
      type: string
      format: uuid
      example: 16e7dfaf-cbc1-4e53-be83-d2a58cf189cf
    Timestamp:
      type: string
      format: date-time
      example: '2026-09-29T10:15:00Z'
    NodeName:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[^/\u0000-\u001f]+$'
      description: Без «/» и управляющих символов; сервер приводит строку к форме NFC
      example: ПР2.pdf
    Fingerprint:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: |
        Отпечаток содержимого: SHA-256 от склеенных SHA-256 блоков по 4 МиБ
        (схема content hash Dropbox), 64 шестнадцатеричных символа. Совпали
        отпечатки, значит, совпало содержимое: по отпечатку узнают дубликат и
        проверяют, не испортился ли файл. Блочная схема нужна потому, что
        Web Crypto считает хэш только целиком, а файл в несколько гигабайт
        целиком в память не помещается.
      example: 3b28d13f4f498ba98316d77dcc3064eb0e7c90837201d074733cf34425c74d51

    Problem:
      type: object
      description: Описание ошибки по RFC 9457
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: https://minicloud.example/problems/name-conflict
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: Идентификатор запроса для поиска в журналах
          example: urn:request:5f0c8e1a
        errors:
          type: array
          description: Только для 422
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
        missing_parts:
          type: array
          description: Только для upload-incomplete
          items:
            type: integer
        required_bytes:
          type: integer
          format: int64
          description: Только для not-enough-space, сколько нужно файлу
        free_bytes:
          type: integer
          format: int64
          description: Только для not-enough-space, сколько свободно с учётом резервов
        existing_node_id:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Только для name-conflict

    UserProfile:
      type: object
      required: [id, email, display_name, cloud_space, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
          example: anna@example.com
        display_name:
          type: string
          example: Анна
        cloud_space:
          $ref: '#/components/schemas/CloudSpace'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    CloudSpace:
      type: object
      description: |
        Место в облаке. Свободно: allocated_bytes − used_bytes − reserved_bytes.
        Если администратор уменьшил место ниже занятого, файлы остаются, но
        новые загрузки не начнутся.
      required: [allocated_bytes, used_bytes, reserved_bytes]
      properties:
        allocated_bytes:
          type: integer
          format: int64
          description: Сколько выделил администратор
          example: 10737418240
        used_bytes:
          type: integer
          format: int64
          description: |
            Занято файлами, включая корзину и дубликаты: каждый файл считается
            по своему размеру, пока его не удалили навсегда. Повреждённые
            файлы места не занимают.
          example: 3221225472
        reserved_bytes:
          type: integer
          format: int64
          description: Зарезервировано под незавершённые загрузки
          example: 52428800

    PasswordTokenRequest:
      type: object
      required: [type, email, password]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [password]
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
    RefreshTokenRequest:
      type: object
      required: [type]
      additionalProperties: false
      description: Сам токен берётся из cookie `mc_refresh`
      properties:
        type:
          type: string
          enum: [refresh_token]
    TokenRequest:
      oneOf:
        - $ref: '#/components/schemas/PasswordTokenRequest'
        - $ref: '#/components/schemas/RefreshTokenRequest'
      discriminator:
        propertyName: type
        mapping:
          password: '#/components/schemas/PasswordTokenRequest'
          refresh_token: '#/components/schemas/RefreshTokenRequest'
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Секунды до истечения access-токена
          example: 900
        user:
          $ref: '#/components/schemas/UserProfile'

    Node:
      type: object
      required: [id, type, name, parent_id, version, created_at, updated_at, trashed_at, purge_after]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum: [folder, file]
        name:
          $ref: '#/components/schemas/NodeName'
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: У корневой папки null
        version:
          type: integer
          minimum: 1
          description: Растёт при каждом изменении; из неё строится ETag
        size_bytes:
          type: integer
          format: int64
          description: Только у файлов
        mime_type:
          type: string
          description: Только у файлов
        status:
          type: string
          enum: [verifying, available, corrupted]
          description: |
            Только у файлов. `verifying`: отпечаток ещё проверяется;
            `available`: можно скачивать и делиться; `corrupted`: содержимое не
            совпало с отпечатком, файл нужно загрузить заново.
        has_preview:
          type: boolean
          description: Только у файлов
        device_modified_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Только у файлов: когда файл изменён на устройстве (по данным
            браузера). Дата загрузки в облако хранится в `created_at`.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        trashed_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Заполнено только у узла, который убрали в корзину явно. Узел внутри
            такой папки сам этого поля не получает, но тоже считается
            удалённым, пока папка в корзине.
        purge_after:
          type: string
          format: date-time
          nullable: true
          description: Когда узел удалится навсегда; заполнено только у узла, который убрали в корзину явно
        download_url:
          type: string
          format: uri
          description: Только в ответе GET /nodes/{nodeId} для файла со статусом available вне корзины
        download_url_expires_at:
          $ref: '#/components/schemas/Timestamp'
    NodeList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        next_cursor:
          type: string
          nullable: true
          description: null, если это последняя страница
    FolderCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/NodeName'
    NodePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/NodeName'
        parent_id:
          type: string
          description: UUID новой папки или `root`
          pattern: '^(root|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
        trashed:
          type: boolean

    UploadCreate:
      type: object
      required: [parent_id, name, size_bytes, fingerprint]
      additionalProperties: false
      properties:
        parent_id:
          type: string
          description: UUID папки или `root`
          pattern: '^(root|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
        name:
          $ref: '#/components/schemas/NodeName'
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 53687091200
          description: Не больше 50 ГиБ; чаще раньше сработает квота
        fingerprint:
          $ref: '#/components/schemas/Fingerprint'
        mime_type:
          type: string
          maxLength: 255
          example: video/mp4
        device_modified_at:
          type: string
          format: date-time
          description: Когда файл изменён на устройстве (File.lastModified)
    UploadSession:
      type: object
      required: [id, status, file_id, parent_id, name, size_bytes, fingerprint, part_size, part_count, uploaded_parts, part_urls, created_at, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [active, completing, completed, aborted, expired]
        file_id:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: |
            ID будущего файла. Известен с первого ответа; файл с этим ID
            появляется в папке после завершения загрузки и обработки события.
            Одна загрузка даёт один файл.
        parent_id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/NodeName'
        size_bytes:
          type: integer
          format: int64
        fingerprint:
          $ref: '#/components/schemas/Fingerprint'
        part_size:
          type: integer
          description: Размер каждой части, кроме последней (сейчас всегда 8 МиБ)
          example: 8388608
        part_count:
          type: integer
          minimum: 0
          maximum: 10000
          description: 0, если передавать байты не нужно (пустой файл или дубликат)
        uploaded_parts:
          type: array
          description: Части, которые S3 уже принял (по данным ListParts)
          items:
            type: object
            required: [part_number, size_bytes]
            properties:
              part_number:
                type: integer
                minimum: 1
                maximum: 10000
              size_bytes:
                type: integer
                format: int64
        part_urls:
          type: array
          description: Подписанные ссылки для PUT недостающих частей, не больше 100 за раз
          items:
            $ref: '#/components/schemas/PartUrl'
        part_urls_expire_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Незавершённая загрузка живёт 7 дней, потом части удаляются и резерв места снимается
    PartUrl:
      type: object
      required: [part_number, url]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        url:
          type: string
          format: uri

    ShareCreate:
      type: object
      additionalProperties: false
      properties:
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
    Share:
      type: object
      required: [id, node_id, created_at, expires_at, open_count, last_opened_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        node_id:
          $ref: '#/components/schemas/Uuid'
        url:
          type: string
          format: uri
          description: Только в ответе на создание
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        open_count:
          type: integer
          minimum: 0
          description: Сколько раз ссылку открыли
        last_opened_at:
          type: string
          format: date-time
          nullable: true
    ShareList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Share'
    PublicShare:
      type: object
      required: [name, size_bytes, mime_type, expires_at, download_url, download_url_expires_at]
      properties:
        name:
          $ref: '#/components/schemas/NodeName'
        size_bytes:
          type: integer
          format: int64
        mime_type:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        download_url:
          type: string
          format: uri
        download_url_expires_at:
          $ref: '#/components/schemas/Timestamp'

    Change:
      type: object
      description: Запись истории
      required: [seq, kind, node_id, node_type, node_name, parent_id, actor, occurred_at, details]
      properties:
        seq:
          type: integer
          format: int64
          description: Номер записи в истории пользователя; номера идут подряд, без пропусков
          example: 1042
        kind:
          type: string
          enum: [added, available, corrupted, renamed, moved, trashed, restored, purged, preview_ready]
          description: |
            `added`: файл загружен или папка создана; `available`: файл
            проверен и доступен; `corrupted`: файл повреждён при загрузке;
            `renamed`, `moved`; `trashed`: удалён в корзину; `restored`:
            восстановлен; `purged`: удалён навсегда (для папки одна запись на
            всё поддерево); `preview_ready`: у файла появилось превью.
        node_id:
          $ref: '#/components/schemas/Uuid'
        node_type:
          type: string
          enum: [folder, file]
        node_name:
          $ref: '#/components/schemas/NodeName'
        parent_id:
          type: string
          format: uuid
          nullable: true
        actor:
          type: string
          enum: [user, system]
          description: system, если изменение сделала фоновая задача (проверка отпечатка, очистка корзины)
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        details:
          type: object
          additionalProperties: true
          description: Подробности, например старое и новое имя при переименовании
          example:
            old_name: ПР2.pdf
            new_name: ПР2 (финал).pdf
    ChangeList:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Change'
        next_cursor:
          type: string
          description: Передать в следующий запрос; есть всегда
        has_more:
          type: boolean
          description: true, если события есть и после этой страницы
